      - power-system-resources
      - default-emergency-durations
    forecast-proposal-status:
      type: object
      description: '

        Status of the rating provider''s forecast proposal relative to the current

        forecast window.  Includes any validation errors encountered while

        processing proposals.

        '
      properties:
        incomplete-obligation-count:
          description: '

            The number of facilities for this provider whose Ratings Obligation has

            not been met in this forecast window. This number may be larger than the

            size of `incomplete-obligations`, since the latter has a pre-defined

            upper bound for performance and application security reasons.


            The Ratings Provider should check that this value is zero when they

            believe they have completed their submission process.

            '
          type: integer
          format: uint16
          minimum: 0
          maximum: 50000
        incomplete-obligations:
          type: array
          description: '

            Indicates which Ratings Obligations have not been fulfilled. The size of

            this set is bounded and may be less than the actual count of unfulfilled

            Obligations indicated in `incomplete-obligation-count`. The intended use

            case for this set is debugging and troubleshooting.

            '
          minItems: 0
          maxItems: 50000
          items:
            $ref: '#/components/schemas/names'
        invalid-proposal-count:
          description: '

            The number of `resource-forecast-proposal` objects that have been

            determined to be *invalid* during this Forecast Window for the current

            Ratings Provider. This count is provided for troubleshooting,

            establishing trends, and triggering alerts.

            '
          type: integer
          format: uint16
          minimum: 0
          maximum: 50000
        proposal-validation-errors:
          type: array
          description: The most recent validation errors
          minItems: 0
          maxItems: 50
          items:
            type: object
            additionalProperties: false
            description: 'Validation errors.


              Note to implementors, the property `resource-id` intentionally is not `names`

              as was used in `incomplete-obligations` to mitigate the

              possibility of information disclosure when a Ratings Provider

              submits a proposal for a valid resource that they are not

              permitted to write to. It should be the same `resource-id` that

              the client submitted.

              '
            properties:
              message:
                type: string
                pattern: ^(.){1,500}$
                maxLength: 500
                example: The `resource-forecast-proposal` for `8badf00d` is incomplete.
              resource-id:
                $ref: '#/components/schemas/resource-id'
        source:
          $ref: '#/components/schemas/data-provenance'
        begins:
          $ref: '#/components/schemas/period-start'
      required:
      - source
      - begins
      - incomplete-obligation-count
      - incomplete-obligations
      - invalid-proposal-count
      - proposal-validation-errors
  parameters:
    static-only:
      name: static-only
      description: '

        Only return limits determined by static ratings.  Without this parameter a

        forecast limits snapshot would include contain limits determined by

        considering dynamic ratings, like AARs or DLRs, when those were available for

        a particular forecast period.


        With `static-only=true`, the forecast limits snapshot would only include

        limits that were determined using static ratings, such as seasonal ratings,

        seasonal overrides, temporary AAR exceptions, operator overrides, etc.

        '
      in: query
      required: false
      schema:
        type: boolean
        default: false
    temporal-resolution:
      name: temporal-resolution
      description: "Specifies the time aggregation for the forecast using ISO 8601 Duration\nsyntax. If not provided, the API will default to hourly. Examples of values\nthat **may** be supported by a given implementation include:\n  * Hourly (default): PT1H\n  * Daily: P1D\n  * Weekly: P1W\n  * Monthly: P1M\n  * Yearly: P1Y\n  * Quarterly: P3M\n\nIf the API does not support the requested `temporal_resolution`, it will\nreturn a `422 Unprocessable Content` response.\n\nWhen this parameter is provided, both `offset-period-start` and `period-end`\nare required.\n\nGiven `temporal-resolution` **R**, `offset-period-start` **S**, and\n`period-end` **E**, both **S** and **E** must agree on each duration component\nto the right of (so smaller than) **R**. For example, this is a valid\ncombination:\n\n| parameter           | value                |\n| :---                | :---                 |\n| temporal-resolution | P1D (i.e. \"daily\")   |\n| offset-period-start | 2025-01-01T01:00:00Z |\n| period-end          | 2025-01-04T01:00:00Z |\n\nHowever, this is not valid because the hours do not agree:\n| parameter           | value                    |\n| :---                | :---                     |\n| temporal-resolution | P1D                      |\n| offset-period-start | 2025-01-01T**01**:10:00Z |\n| period-end          | 2025-01-04T**12**:00:00Z |\n\nNote that the minutes do not agree either, but that is essentially\ninconsequential since at the daily resolution the hours must first agree.\n\nAs discussed in their respective parameters, `offset-period-start` and\n`period-end` nominate the **beginning** of the first and **end** of the last period\n(interval), respectively. Given our valid example above, the first period in\nthe forecast would be for the 24-hours starting at `2025-01-01T01:00:00Z` and\nending at `2025-01-02T01:00:00Z`, and the final period would be for the\n24-hour period starting at `2025-01-03T01:00:00Z` and ending at\n`2025-01-04T01:00:00Z`.\n\n"
      in: query
      required: false
      schema:
        type: string
        format: duration
        maxLength: 10
        default: PT1H
        example: P1D
    resource-id-filter:
      name: resource-id
      description: 'Only return limits for this power system resource

        '
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/resource-id'
      examples:
        circuit-id:
          summary: A typical AC line identifier
          value: '86753_1'
        mrid:
          summary: A CIM mrid for a power system resource
          value: urn:uuid:123e4567-e89b-12d3-a456-426614174000
    offset-period-start:
      name: offset-period-start
      description: 'Rather than return the entire forecast from the beginning, i.e., the next operating period, instead return a subset of the forecast starting with the period starting at `offset-period-start`.

        '
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/period-start'
    period-end:
      name: period-end
      description: Specifies the end of a period for which a filter specifies.  Periods will only be returned that start prior to this time.
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/period-start'
    query-filter:
      name: monitoring-set
      description: '

        Only return ratings or limits for facilities of the associated

        `monitoring-set`. The identifier for a `monitoring-set` is pre-coordinated,

        but using the NERC id of the associated Ratings Provider for the default

        monitoring set is recommended.

        '
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/local'
      examples:
        name:
          summary: A pre-coordinated name that nominates a `monitoring-set` for a specific entity or purpose.
          value: X-AMPL
        mrid:
          summary: A pre-coordinated id that nominates a `monitoring-set`.
          value: urn:uuid:12345678-1234-5678-1234-123456789012
  headers:
    Retry-After:
      schema:
        type: integer
        format: int32
        minimum: 0
        maximum: 60
        example: 60
        description: The seconds to delay after the response is received.
    X-Rate-Limit-Reset:
      description: The number of seconds left in the current period
      schema:
        type: integer
        format: int32
        minimum: 0
        maximum: 1000
    ETag:
      description: 'An opaque, unique identifier--typically a hash value--for a specific version of a resource. The modeled resource state is what is versioned, not the content of any particular representation. The server MUST use a strong validator so that the same ETag is returned regardless of the media type of the representation.

        '
      schema:
        type: string
        format: hash
        maxLength: 256
        additionalProperties: false
    X-Rate-Limit-Limit:
      description: The number of allowed requests in the current period
      schema:
        type: integer
        format: int32
        minimum: 0
        maximum: 1000
    X-Rate-Limit-Remaining:
      description: The number of remaining requests in the current period
      schema:
        type: integer
        format: int32
        minimum: 0
        maximum: 1000
  requestBodies:
    requestBody:
      required: true
      content:
        application/vnd.trolie.rating-forecast-proposal.v1+json:
          schema:
            $ref: '#/components/schemas/array-max-monitored-elements_forecast-proposal'
          example:
            proposal-header:
              source:
                last-updated: '2025-10-31T15:05:43.044267100-07:00'
                provider: UTILITY-A
                origin-id: 5aeacb25-9b65-4738-8a00-ac10afa63640
              begins: '2025-11-01T01:00:00-05:00'
              default-emergency-durations:
              - name: LTE
                duration-minutes: 240
              - name: STE
                duration-minutes: 30
              - name: DAL
                duration-minutes: 15
              power-system-resources:
              - resource-id: 8badf00d
                alternate-identifiers:
                - name: segmentX
                  authority: TO-NERC-ID
                - name: LINE1 SEG-X
                  authority: RC-NERC-ID
                  mrid: 8badf00d
            ratings:
            - resource-id: 8badf00d
              periods:
              - period-start: '2025-11-01T01:00:00-05:00'
                period-end: '2025-11-01T02:00:00-05:00'
                continuous-operating-limit:
                  mva: 160
                emergency-operating-limits:
                - duration-name: LTE
                  limit:
                    mva: 165
                - duration-name: STE
                  limit:
                    mva: 170

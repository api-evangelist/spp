apis:
- aid: spp:spp-public-data-ftp
  name: SPP Public Data FTP
  description: >-
    SPP's officially documented programmatic interface to its public data. The SPP Public Data Access
    guide (v3.0, July 2023) names FTP as the programmatic access path for Integrated Marketplace, Western
    Reliability Coordination and WEIS public data. Verified anonymously on 2026-07-27: a listing returned
    FTP status 226 with top-level directories including Markets, Operational_Data, Operations_Reports,
    Settlements, Reliability, TCR, Market_Monitoring and West_EIS. No account, key or licence agreement
    is required.
  humanURL: https://spp.org/documents/28853/spp%20public%20data%20access%2020230707.pdf
  baseURL: ftp://pubftp.spp.org
  tags:
  - Public Data
  - Market Data
  - FTP
  properties:
  - type: Documentation
    url: https://spp.org/documents/28853/spp%20public%20data%20access%2020230707.pdf
  - type: Documentation
    url: https://www.spp.org/stakeholder-center/user-guides-apis-integrations/
- aid: spp:spp-portal-file-browser-api
  name: SPP Portal Public Data File Browser API
  description: >-
    The HTTP download service behind the SPP Portal public data pages. Anonymous GET requests of the form
    /file-browser-api/download/{dataset}?path={file} return CSV for real-time balancing market LMP by
    settlement location, real-time and day-ahead market clearing prices, operating reserves, hourly load,
    historical generation mix, VER curtailments, capacity of generation on outage, and the WEIS market
    equivalents. Eight dataset paths were confirmed HTTP 200 with content-type text/csv on 2026-07-27
    with no credentials. SPP documents the datasets and file formats in its Markets Public Data Guide
    but does not publish this HTTP path as a supported interface specification — FTP is the interface
    SPP formally supports.
  humanURL: https://portal.spp.org/pages/rtbm-lmp-by-location
  baseURL: https://portal.spp.org/file-browser-api/download
  tags:
  - Public Data
  - Market Data
  - LMP
  - Load
  - Generation Mix
  properties:
  - type: Documentation
    url: https://portal.spp.org/pages/rtbm-lmp-by-location
  - type: Documentation
    url: https://www.spp.org/documents/19541/spp%20markets%20public%20data%20guide.pdf
  - type: AgentSkill
    name: Pull SPP public market data
    url: skills/spp-public-market-data.md
  - type: Examples
    url: examples/_index.yml
- aid: spp:spp-portal-chart-api
  name: SPP Portal Chart API
  description: >-
    JSON and CSV chart feeds serving the SPP Portal dashboards. Confirmed anonymously on 2026-07-27: /chart-api/gen-mix/asChart
    and /chart-api/load-forecast/asChart return application/json with labelled hourly datasets by fuel
    type and load forecast series, and /chart-api/gen-mix-365/asFile returns a rolling 365-day generation
    mix CSV. Undocumented as a formal interface specification; served without authentication.
  humanURL: https://portal.spp.org/pages/generation-mix-historical
  baseURL: https://portal.spp.org/chart-api
  tags:
  - Public Data
  - Generation Mix
  - Load Forecast
  properties:
  - type: Documentation
    url: https://portal.spp.org/pages/generation-mix-historical
- aid: spp:spp-price-contour-map-arcgis
  name: SPP Price Contour Map ArcGIS REST Services
  description: >-
    An Esri ArcGIS Server REST directory serving the geospatial layers behind SPP's price contour map.
    Confirmed anonymously on 2026-07-27 at ArcGIS 11.5: the service root returned JSON listing the PCM
    and Utilities folders, and the PCM folder listed DA_Features, DA_LMP, DELTA_Features, DELTA_LMP, RTBM_Features,
    RTBM_LMP, States and Transmission MapServer services. Follows the standard Esri ArcGIS REST API contract
    (?f=json), not an SPP-authored specification.
  humanURL: https://pricecontourmap.spp.org/arcgis/rest/services
  baseURL: https://pricecontourmap.spp.org/arcgis/rest/services
  tags:
  - Geospatial
  - Market Data
  - LMP
  - ArcGIS
  properties:
  - type: APIReference
    url: https://pricecontourmap.spp.org/arcgis/rest/services?f=json
- aid: spp:spp-integrated-marketplace-web-services
  name: SPP Integrated Marketplace Markets Web Service
  description: >-
    The SOAP web and notification services market participants use to submit offers and bids and retrieve
    results from the SPP Integrated Marketplace, with WEIS Markets Web Service as the western equivalent
    and the Settlement Management System API for settlements. SPP's System Interfaces Stakeholder Reference
    Guide (v1.0, 29 Jan 2025) names these as SOAP and REST services over HTTPS requiring two-factor authentication;
    the Markets+ platform is stated to move to RESTful APIs. WSDLs, XSDs and endpoint URLs are published
    only inside the member-facing Change User Forum technical reference documents and were not retrievable
    anonymously; no base URL is public.
  humanURL: >-
    https://www.spp.org/documents/73131/spp%20system%20interfaces%20stakeholder%20reference%20guide%2020250129.pdf
  tags:
  - SOAP
  - Wholesale Markets
  - Settlement
  - Gated
  tags_raw:
  - SOAP
  - Wholesale Markets
  - Settlements
  - Gated
  properties:

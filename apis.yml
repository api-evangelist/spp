aid: spp
url: https://raw.githubusercontent.com/api-evangelist/spp/refs/heads/main/apis.yml
name: Southwest Power Pool
kind: company
description: >-
  Southwest Power Pool (SPP) is a nonprofit Regional Transmission Organization
  regulated by the Federal Energy Regulatory Commission and headquartered in
  Little Rock, Arkansas. Founded in 1941 and approved as an RTO in 2004, SPP
  operates the Integrated Marketplace day-ahead and real-time balancing markets,
  the Western Energy Imbalance Service (WEIS) market, Western Reliability
  Coordination services, and is building the Markets+ day-ahead market for the
  West with a targeted 2027 go-live. SPP sits at the wholesale layer of the
  United States energy value chain: it dispatches generation, prices congestion,
  plans transmission, and settles the market for its member utilities — it has no
  retail customers, so no consumer energy-data mandate such as Green Button
  applies to it. Its API posture is a clean split. Market and grid data is
  genuinely open: locational marginal prices, market clearing prices, operating
  reserves, load, generation mix, VER curtailments and outage capacity are served
  anonymously as CSV from the SPP Portal file browser and from an anonymous public
  FTP site, with an Esri ArcGIS REST price-contour service alongside — no account,
  no key, no licence click-through. Everything a market participant actually
  transacts against is the opposite: the Integrated Marketplace SOAP web services,
  the Settlement Management System API, and the FERC Order 881 LEP/TROLIE ratings
  API are member-only, require an OATI webCARES x.509 digital certificate plus an
  SPP UAA role, and SPP publishes no base URL and no OpenAPI for them.
accessModel:
  pricing: free
  onboarding: none-published
  trial: false
  try_now: true
  public: true

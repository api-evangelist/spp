- aid: spp:spp-forecasting-api
  name: Southwest Power Pool Forecasting API
  description: >-
    The Forecasting API operations define the exchange of forecasted ratings,

    including the 240-hour-ahead forecasted AAR data exchange required by FERC

    Order 881.  The operations support submitting rating proposals, querying

    in-use limits, and monitoring the health and validity of submissions

    against the Rating Provider's obligations.
  humanURL: https://spp.org/documents/28853/spp%20public%20data%20access%2020230707.pdf
  baseURL: ftp://pubftp.spp.org
  tags:
  - Forecasting
  properties:
  - type: OpenAPI
    url: openapi/spp-forecasting-api-openapi.yml
  - type: Documentation
    url: https://www.spp.org/documents/72496/spp%20lep%20api%20data%20exchange%20guide.pdf
  - type: Specification
    url: https://trolie.energy/spec
- aid: spp:spp-monitoring-sets-api
  name: Southwest Power Pool Monitoring Sets API
  description: >-
    [Monitoring Sets](https://trolie.energy/concepts#monitoring-sets) are

    named sets of power system resources that may be used to filter ratings

    and limits returned by queries against these APIs. How Monitoring Sets are

    defined is beyond the scope of the TROLIE specification, and it is assumed

    that the sender and receiver have predefined the appropriate Monitoring

    Sets.
  humanURL: https://spp.org/documents/28853/spp%20public%20data%20access%2020230707.pdf
  baseURL: ftp://pubftp.spp.org
  tags:
  - Monitoring Sets
  properties:
  - type: OpenAPI
    url: openapi/spp-monitoring-sets-api-openapi.yml
  - type: Documentation
    url: https://www.spp.org/documents/72496/spp%20lep%20api%20data%20exchange%20guide.pdf
  - type: Specification
    url: https://trolie.energy/spec
- aid: spp:spp-real-time-api
  name: Southwest Power Pool Real Time API
  description: >-
    If permitted by the Clearinghouse Provider, its Ratings Providers can use

    these functions to exchange real-time ratings, supplementing or replacing

    traditional telemetry protocols like ICCP.


    These ratings are based on real-time measurements of ambient conditions

    and will be used by Transmission Providers for real-time grid operations

    processes, including state estimation and real-time markets.  The clearing

    of real-time ratings may be more frequent than for forecast ratings, but

    the frequency is the prerogative of the Clearinghouse Provider.


    These ratings may be either AARs or DLRs.
  humanURL: https://spp.org/documents/28853/spp%20public%20data%20access%2020230707.pdf
  baseURL: ftp://pubftp.spp.org
  tags:
  - Real-Time
  properties:
  - type: OpenAPI
    url: openapi/spp-real-time-api-openapi.yml
  - type: Documentation
    url: https://www.spp.org/documents/72496/spp%20lep%20api%20data%20exchange%20guide.pdf
  - type: Specification
    url: https://trolie.energy/spec
- aid: spp:spp-seasonal-api
  name: Southwest Power Pool Seasonal API
  description: >-
    Seasonal ratings are static ratings associated with extended durations,

    typically months. These are typically used in both planning and

    operations.


    Power system resources that are exempt from providing AARs generally

    operate at a seasonal rating. Even for resources using dynamic ratings, a

    seasonal rating is still necessary. This acts as a recourse when a dynamic

    rating is unavailable.  For example, a dynamic rating

    might be unavailable during communication outages or for forecasts beyond

    the ten-day period required by FERC Order 881.
  humanURL: https://spp.org/documents/28853/spp%20public%20data%20access%2020230707.pdf
  baseURL: ftp://pubftp.spp.org
  tags:
  - Seasonal
  properties:
  - type: OpenAPI
    url: openapi/spp-seasonal-api-openapi.yml
  - type: Documentation
    url: https://www.spp.org/documents/72496/spp%20lep%20api%20data%20exchange%20guide.pdf
  - type: Specification
    url: https://trolie.energy/spec
- aid: spp:spp-seasonal-overrides-api
  name: Southwest Power Pool Seasonal Overrides API
  description: >-
    A Seasonal Override instructs the system to use a temporary static rating

    instead of any concurrent Seasonal Rating for a resource.


    A typical use case is a so-called 'de-rate' due to a temporary clearance

    issue for a transmission facility that is exempt from providing AARs.


    Exempt facilities typically operate at a seasonal rating. However, instead

    of updating the seasonal rating schedule, a Ratings Provider can send a

    Seasonal Override.


    During the override period, the Clearinghouse uses the Seasonal

    Override rating instead of any scheduled seasonal ratings.


    For resources required to provide AARs, a Ratings Provider would issue a

    Temporary AAR Exception to address temporary conditions requiring a static

    rating.
  humanURL: https://spp.org/documents/28853/spp%20public%20data%20access%2020230707.pdf
  baseURL: ftp://pubftp.spp.org
  tags:
  - Seasonal Overrides
  properties:
  - type: OpenAPI
    url: openapi/spp-seasonal-overrides-api-openapi.yml
  - type: Documentation
    url: https://www.spp.org/documents/72496/spp%20lep%20api%20data%20exchange%20guide.pdf
  - type: Specification
    url: https://trolie.energy/spec
- aid: spp:spp-temporary-aar-exceptions-api
  name: Southwest Power Pool Temporary AAR Exceptions API
  description: "A [Temporary AAR Exception](https://trolie.energy/concepts#temporary-aar-exception) is\n\
    provided by the Ratings Provider when a Ratings Obligation cannot be\nfulfilled, due to some temporary\
    \ operating condition impacting the related\npower system resource.  This could occur in various scenarios:\n\
    \n  * An equipment failure.\n  * An unforeseen condition on a related part of the power grid.\n  *\
    \ Some ambient condition that is not part of the model is heating the\n    line, like a wildfire.\n\
    \  * Something in the surrounding environment is affecting the amount that a\n    line is allowed\
    \ to sag. For example, this may occur for lines over\n    rivers when very large ships pass under\
    \ them\n\nA Temporary AAR Exception serves two main purposes: documenting the reason\nfor the exception\
    \ and providing a temporary rating value set. It is employed\nin three distinct circumstances:\n\n\
    1. Firstly, Order 881 mandates documentation and archival of all use of\n alternate ratings in lieu\
    \ of AARs. Ratings Providers should continue to\n provide real-time and forecast ratings for the affected\
    \ resource, but\n these should match the rating provided with the Temporary AAR Exception\n while\
    \ the latter is in effect. This temporary rating, and the reason that\n it occurred, must be captured\
    \ in history regardless of the provided\n ratings.  The reason and the end date of the effective window\
    \ may be\n updated after the object has been created, up to a configurable threshold.\n\n   If the\
    \ Ratings Providers provides ratings that deviate from the static\n   Temporary AAR Exception rating,\
    \ the Clearinghouse Provider must decide\n   whether to use those or the static rating. The Clearinghouse\
    \ Provider\n   advise its Ratings Providers on how it will choose ahead of time. This\n   specification\
    \ recommends using the dynamic rating provided, but it does\n   not mandate it.\n\n2. Secondly, Temporary\
    \ AAR Exceptions apply when the Clearinghouse\n  Provider is generating forecast rating proposals\
    \ on behalf of the Ratings Provider, e.g., when lookup tables are provided ahead of time by the Ratings\
    \ Provider.\n  Since there is no external ratings, the Clearinghouse Provider\n  wouldn't otherwise\
    \ know that a temporary static rating is needed. \n\n3. Finally, for facilities where dynamic ratings\
    \ are provided, it is\n  possible that a communications outage or other issue could prevent the\n\
    \  Clearinghouse Provider from receiving the dynamic ratings. In this case,\n  the Clearinghouse Provider\
    \ would use a Temporary AAR Exception rating."
  humanURL: https://spp.org/documents/28853/spp%20public%20data%20access%2020230707.pdf
  baseURL: ftp://pubftp.spp.org
  tags:
  - Temporary AAR Exceptions
  properties:
  - type: OpenAPI
    url: openapi/spp-temporary-aar-exceptions-api-openapi.yml
  - type: Documentation
    url: https://www.spp.org/documents/72496/spp%20lep%20api%20data%20exchange%20guide.pdf
  - type: Specification
    url: https://trolie.energy/spec

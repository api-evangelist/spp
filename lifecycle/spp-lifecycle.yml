  change_process:
    name: SPP Revision Request process
    url: https://www.spp.org/governance/spp-revision-requests/
    note: >-
      Tariff and protocol changes — including changes that reach market systems —
      are filed, tracked and approved as Revision Requests through SPP governance.
      Technical interface changes are communicated to market participants through
      the member-facing Change User Forum, not through a public changelog.

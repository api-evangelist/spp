status_page_note: >-
  status.spp.org does not resolve (curl exit 000, 2026-07-27). SPP publishes
  https://www.spp.org/markets-operations/current-grid-conditions/, which reports
  the state of the power grid — load, generation mix, reserve margins — not the
  availability of SPP's own systems or APIs. Planned system outages are
  communicated to members through RMS notifications, which are not public.

note: >-
  SPP versions documents, not interfaces. Every reference guide is published as a
  versioned, dated PDF (System Interfaces Stakeholder Reference Guide v1.0
  2025-01-29; LEP/TROLIE API Data Exchange Guide v1.0 2024-11-08; Public Data
  Access v3.0 July 2023), and revisions to market systems move through the SPP
  Revision Request process and the Change User Forum. There is no API version
  segment, no version header, no published deprecation policy, no Sunset or
  Deprecation header support and no service-level agreement for any interface. No
  API status page exists: status.spp.org does not resolve.

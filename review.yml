accessGate:
  publicTier: self-serve
  publicTierDetail: >-
    For the open market-data surface there is effectively no gate at all. A
    developer opens https://portal.spp.org, navigates to a data page, and can hit
    the underlying file-browser-api or chart-api URL directly, or connect to
    ftp://pubftp.spp.org anonymously. No registration, no API key, no rate-limit
    documentation, no terms acceptance step is enforced in the request path.
  participantTier: partner-only
  participantTierDetail: >-
    For anything a market participant transacts against, the gate is membership.
    A developer must (1) have their organization registered with SPP as a member,
    market participant, transmission owner/operator or other stakeholder, (2)
    obtain an OATI webCARES x.509 digital certificate — SPP's Digital Certificates
    and the Integrated Marketplace document states OATI is the only Certificate
    Authority trusted by Integrated Marketplace applications, (3) have a Local
    Security Administrator assign the user roles and scope in SPP UAA, and (4)
    open an RMS ticket (https://rms.spp.org/, HTTP 200) to request access and, for
    some documents such as the AGC Integration Guide and ICCP Handbook, to request
    the password that unlocks the specification itself. The WSDLs, XSDs and
    endpoint URLs live in the member-facing Change User Forum technical reference
    documents.
  overall: self-serve
  overallNote: >-
    Recorded as self-serve because the surface a developer can actually reach and
    build on is completely ungated. The gated tier is real but is a membership
    relationship, not a developer onboarding funnel.
authModel:
  publicData: >-
    None. Anonymous HTTP GET and anonymous FTP. No key, no token, no cookie
    required for any confirmed open endpoint.
  participantApis: >-
    Two-factor: an x.509 client certificate issued by a CA SPP trusts (OATI
    webCARES for Integrated Marketplace) presented over mTLS, plus an SPP UAA
    identity whose roles and scope authorize the specific API function. SPP's
    System Interfaces Stakeholder Reference Guide states most programmatic
    services require two-factor authentication. The LEP/TROLIE guide describes
    UAA authenticating the certificate then looking up the user's roles and scope
    per connection.
  openidConnect:
    probed: true
    result: >-
      https://portal.spp.org/.well-known/openid-configuration returned HTTP 200
      but with content-type text/html and 609 bytes — the React SPA index shell,
      not a discovery document. https://www.spp.org/.well-known/openid-configuration
      returned HTTP 404. No OpenID Connect discovery document is served.
  oauthInSpec: >-
    The TROLIE standard spec declares one security scheme, oauth2-primary-flow.
    That is the standard's scheme, not evidence of an SPP-hosted OAuth server.
developerPortal:
  url: https://www.spp.org/stakeholder-center/user-guides-apis-integrations/
  status: 200
  confirmed: false
  note: >-
    SPP has no developer portal in the ordinary sense. The closest thing is the
    "User Guides, APIs & Integrations" stakeholder-centre page, which is a landing
    hub that links to PDF reference guides rather than a signup-and-build surface.
    https://portal.spp.org is the SPP Portal — part public data browser, part
    member application login — not a developer portal. Marked confirmed:false
    because no self-serve developer registration, key issuance, interactive
    reference or sandbox exists.
specHarvest:
  openapiFound: true
  sppAuthoredSpecs: 0
  sppAuthoredNote: >-
    SPP publishes no OpenAPI, Swagger, AsyncAPI, GraphQL schema or Postman
    collection of its own. Probes of https://portal.spp.org/openapi.json,
    /swagger.json, /v3/api-docs and /api-docs all returned the 609-byte SPA index
    shell (HTTP 200, text/html) or HTTP 404 — none is a specification. SPP's
    machine-readable contracts for member APIs are SOAP WSDL/XSD files distributed
    inside the member-only Change User Forum.
  harvested:
  - file: openapi/trolie-standard-openapi.yml
    sourceUrl: https://trolie.energy/openapi-1.0.yaml
    httpStatus: 200
    contentType: text/yaml
    bytes: 338771
    fetchDate: '2026-07-27'
    parses: true
    openapiVersion: 3.0.3
    title: Transmission Ratings and Operating Limits Information Exchange (TROLIE)
    specVersion: 1.1.0
    pathCount: 16
    provenance: >-
      IMPORTANT — this specification is NOT authored or published by Southwest
      Power Pool. It is the LF Energy TROLIE community specification, published at
      trolie.energy and developed in github.com/trolie/spec. It is stored here
      because SPP's own "SPP LEP/TROLIE API Data Exchange Guide" v1.0 explicitly
      directs implementers to it as the contract for SPP's LEP ratings API, and
      because SPP publishes no contract of its own. Servers block declares the
      placeholder https://trolie.example.com, which is the standard's example host,
      not an SPP host.
    paths:
    - GET /limits/forecast-snapshot
    - GET /limits/forecast-snapshot/{period}
    - GET|POST /limits/regional/forecast-snapshot
    - GET|POST /rating-proposals/realtime
    - GET /limits/realtime-snapshot
    - GET /limits/regional/realtime-snapshot
    - GET|PATCH /rating-proposals/forecast
    - GET /seasonal-ratings/snapshot
    - GET|PATCH /rating-proposals/seasonal
    - GET|POST /seasonal-overrides
    - GET|PUT|DELETE /seasonal-overrides/{id}
    - GET|POST /temporary-aar-exceptions
    - GET|PUT|DELETE /temporary-aar-exceptions/{id}
    - POST /monitoring-sets
    - GET|PUT|DELETE /monitoring-sets/{id}
    - GET /default-monitoring-set

findings:
  summary: >-
    Southwest Power Pool is the clearest possible illustration of the
    consumer-versus-market split in energy. On the market side SPP is one of the
    most open data publishers in the sector: real-time and day-ahead LMPs, market
    clearing prices, operating reserves, load, forecast, generation mix, VER
    curtailments and outage capacity are all reachable with a bare anonymous GET or
    an anonymous FTP session, plus an ArcGIS REST geospatial service for the price
    contour map. On the consumer side there is nothing, correctly — SPP is a
    wholesale operator with no retail customers, so no Green Button, no CDR-style
    consumer data right and no consent framework applies. The mandate that does
    touch SPP is FERC Order 881, and SPP's response is genuinely interesting: it
    adopted the LF Energy TROLIE OpenAPI specification rather than inventing a
    proprietary contract, and published a real versioned data exchange guide for it.
    But SPP itself publishes no OpenAPI, no base URL and no developer portal for
    that API, so the implementation could only be recorded as claimed, not verified.
    The participant tier as a whole is still SOAP over mTLS with OATI certificates
    and RMS tickets; the promised move to REST arrives with Markets+ in 2027.
  openSurfaceQuality: >-
    High coverage, low API maturity. The data is excellent and free, but it is
    delivered as dated CSV file paths a consumer must construct by convention, with
    no listing endpoint (/file-browser-api/ itself returns 404), no OpenAPI, no
    documented rate limits, no versioning policy and no formal support commitment —
    SPP's own reference guide warns that "any access or exchange of data outside of
    officially published SPP interface specifications is neither supported nor
    encouraged," which describes the HTTP file-browser-api path most third-party
    tools actually use.

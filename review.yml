aid: spp
name: Southwest Power Pool
review:
  question: >-
    Does Southwest Power Pool publish a public API surface, and does any energy
    data mandate apply to it — and if so, is it implemented?
  answer: partial
  date: '2026-07-27'
  reviewer: API Evangelist
  homeMarket: United States
  tier: system-operator
mandate:
  regime: other
  regimeDetail: >-
    No consumer energy-data right applies to SPP. Green Button (NAESB REQ.21 /
    ESPI) is a retail-utility standard for individual customer usage data; SPP is
    a wholesale Regional Transmission Organization with no retail customers, so
    Green Button — voluntary or otherwise — is not applicable. The Australian
    Consumer Data Right (energy) and the Ontario Green Button regulation are
    foreign regimes and do not reach SPP. The only regulatory obligation found
    that directly shapes an SPP API is FERC Order 881, which requires
    ambient-adjusted transmission line ratings to be exchanged between
    transmission owners and grid operators; SPP also operates under FERC's
    general market-transparency requirements for RTO price and market data.
  status: live-claimed-unverified
  statusEvidence: >-
    SPP published the "SPP LEP/TROLIE API Data Exchange Guide" v1.0 dated
    2024-11-08 (HTTP 200, 1,069,254 bytes, fetched 2026-07-27), a real versioned
    specification document describing its implementation of GE Vernova's Limit
    Exchange Portal against the LF Energy TROLIE OpenAPI specification, with
    concrete request/response examples for monitoring sets, forecast ratings,
    real-time ratings and seasonal ratings. That is a published implementation
    guide, NOT a verified live endpoint. SPP's own guide writes every example
    against the placeholder host "https://<baseURL>/lep-operations/..." — no
    production hostname is published anywhere public. Probes of api.spp.org,
    developer.spp.org, developers.spp.org, docs.spp.org and data.spp.org all
    failed to resolve (curl exit status 000). Authentication requires an x.509
    digital certificate from a CA SPP trusts plus a role assigned in SPP UAA, so
    the surface cannot be reached or conformance-checked anonymously. Recorded as
    live-claimed-unverified: the obligation is real, the implementation is
    documented, the running endpoint was not observed.
  notApplicable:
  - regime: green-button-voluntary
    reason: SPP has no retail customers; Green Button/ESPI is a retail utility standard.
  - regime: cdr-energy
    reason: Australian regime; SPP is a US RTO.
  - regime: green-button-ontario
    reason: Ontario regulation; SPP operates in the United States.
  - regime: smart-meter-infrastructure
    reason: >-
      No UK DCC-style metering infrastructure mandate applies. SPP receives
      telemetry from members over ICCP and AGC (TCP/IP), not from a mandated
      smart-meter data hub.
dataStandard:
  primary: >-
    LF Energy TROLIE (Transmission Ratings and Operating Limits Information
    Exchange), OpenAPI 3.0.3, spec version 1.1.0 — implemented by SPP's LEP
    ratings API per SPP's own data exchange guide.
  others:
  - ICCP (IEC 60870-6/TASE.2) for control-centre to control-centre telemetry, named
    in the SPP System Interfaces Stakeholder Reference Guide.
  - IEEE C37.118 PMU streaming over TCP/IP, named in the same guide (PMU Communication Handbook).
  - Esri ArcGIS REST API for the price contour map geospatial services.
  - Proprietary SPP SOAP WSDL/XSD contracts for Integrated Marketplace, WEIS and
    Settlement Management System web services.
  notFound:
  - Green Button / ESPI — no reference found anywhere on spp.org.
  - IEC CIM 61968/61970 — no public reference found in SPP stakeholder documentation.
  - OpenADR, IEEE 2030.5, OCPP, OCPI — not applicable to a wholesale market operator; none found.
  publicMarketData: >-
    No standard reference found. SPP's public market data is delivered as bare CSV
    files with SPP-defined column headers, documented in the SPP Markets Public
    Data Guide, not against any industry data model.
dataSplit:
  consumerDataApi: false
  consumerDataNote: >-
    SPP has no consumer-facing data surface at all. It is a wholesale market
    operator; individual customer usage and billing data lives with the member
    load-serving entities and their state regulators, never with SPP. There is no
    consent framework, no accreditation scheme and no third-party customer-data
    API to find.
